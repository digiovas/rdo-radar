[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdo-radar"
version = "0.1.0"
description = "Monitoraggio quotidiano delle RDO aperte su acquistinretepa.it, con analisi dei documenti allegati"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
